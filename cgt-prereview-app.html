<script type="text/babel" data-presets="react">
const { useState, useRef } = React;

/* =========================================================
   설정값
   ========================================================= */

const API_URL = "https://script.google.com/macros/s/AKfycbz5q2h4iZiQyp7XTpdRFQPuSxcP0yjSED_mU72Sp5zT-RUEU5gKpjwPvqoCK_B8oCDi/exec";

const STEPS = [
  { id: 1, label: "신청자 정보" },
  { id: 2, label: "자료 제출" },
  { id: 3, label: "부동산·신고정보" },
  { id: 4, label: "동의 및 제출" },
];

const ADVISOR = {
  name: "백기현 세무사",
  phone: "010-5787-4192",
  email: "taxoasis4192@gmail.com",
};

const PROPERTY_TYPES = [
  "아파트", "단독주택", "다가구주택", "다세대/연립주택",
  "오피스텔", "상가", "건물", "토지", "기타",
];

const ALLOWED_EXT = ["pdf", "jpg", "jpeg", "png"];
const MAX_FILE_SIZE = 8 * 1024 * 1024;
const TODAY = new Date().toISOString().slice(0, 10);

/* =========================================================
   유틸 함수
   ========================================================= */

function onlyDigits(v) { return (v || "").replace(/[^0-9]/g, ""); }

function formatPhone(v) {
  const d = onlyDigits(v).slice(0, 11);
  if (d.length <= 3) return d;
  if (d.length <= 7) return d.slice(0, 3) + "-" + d.slice(3);
  if (d.length <= 10) return d.slice(0, 3) + "-" + d.slice(3, 6) + "-" + d.slice(6);
  return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
}

function isValidPhone(v) {
  const d = onlyDigits(v);
  return d.length === 10 || d.length === 11;
}

function isValidEmail(v) {
  if (!v) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

function formatMoneyInput(v) {
  const d = onlyDigits(v);
  if (!d) return "";
  return Number(d).toLocaleString("ko-KR");
}

function moneyToNumber(v) {
  const d = onlyDigits(v);
  return d ? Number(d) : 0;
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + "B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + "KB";
  return (bytes / 1024 / 1024).toFixed(1) + "MB";
}

function getExt(filename) {
  const m = /\.([^.]+)$/.exec(filename || "");
  return m ? m[1].toLowerCase() : "";
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result || "";
      const idx = result.indexOf(",");
      resolve(idx >= 0 ? result.slice(idx + 1) : result);
    };
    reader.onerror = () => reject(new Error("파일을 읽는 중 문제가 발생했습니다."));
    reader.readAsDataURL(file);
  });
}

async function postToAppsScript(payload) {
  let res;
  try {
    res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
  } catch (e) {
    throw new Error("서버에 연결할 수 없습니다. 네트워크 상태를 확인한 후 다시 시도해주세요.");
  }
  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error("서버 응답을 확인할 수 없습니다. 잠시 후 다시 시도해주세요.");
  }
  if (!data || data.success !== true) {
    throw new Error((data && data.message) || "요청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.");
  }
  return data;
}

function validateApplicant(a) {
  const e = {};
  if (!a.name.trim()) e.name = "성명을 입력해주세요.";
  if (!isValidPhone(a.phone)) e.phone = "휴대전화 번호를 정확히 입력해주세요.";
  if (a.email && !isValidEmail(a.email)) e.email = "이메일 형식을 확인해주세요.";
  return e;
}

function validateProperty(p) {
  const e = {};
  if (!p.propertyType) e.propertyType = "부동산 종류를 선택해주세요.";
  if (!p.propertyAddress.trim()) e.propertyAddress = "부동산 소재지를 입력해주세요.";
  if (!p.acquisitionDate) e.acquisitionDate = "취득일을 입력해주세요.";
  if (!p.transferDate) e.transferDate = "양도일을 입력해주세요.";
  if (p.acquisitionDate && p.transferDate && p.acquisitionDate > p.transferDate) {
    e.transferDate = "양도일은 취득일과 같거나 이후여야 합니다.";
  }

function FileDropzone({ id, label, required, hint, multiple, files, onAdd, onRemove, error }) {
  const inputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);
  const [localMsg, setLocalMsg] = useState("");

  const process = (fileList) => {
    const arr = Array.from(fileList || []);
    if (!arr.length) return;
    const accepted = [];
    const rejected = [];
    arr.forEach((f) => {
      const okType = ALLOWED_EXT.indexOf(getExt(f.name)) !== -1;
      const okSize = f.size <= MAX_FILE_SIZE;
      if (okType && okSize) accepted.push(f);
      else rejected.push(f.name + (!okType ? " (지원하지 않는 형식)" : " (8MB 초과)"));
    });
    setLocalMsg(rejected.length ? "다음 파일은 추가되지 않았습니다: " + rejected.join(", ") : "");
    if (accepted.length) onAdd(multiple ? accepted : accepted[0]);
  };

  const currentFiles = multiple ? files : (files ? [files] : []);

  return (
    <div className={"cgt-field" + (error ? " cgt-field--error" : "")}>
      <label className="cgt-field-label" htmlFor={id}>
        {label}{required && <span className="cgt-required" aria-hidden="true">*</span>}
      </label>
      {hint && <p className="cgt-field-hint" style={{ marginTop: 0, marginBottom: 10 }}>{hint}</p>}
      <div
        className={"cgt-dropzone" + (dragOver ? " cgt-dropzone--drag" : "")}
        role="button"
        tabIndex={0}
        onClick={() => inputRef.current && inputRef.current.click()}
        onKeyDown={(e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            inputRef.current && inputRef.current.click();
          }
        }}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={(e) => { e.preventDefault(); setDragOver(false); process(e.dataTransfer.files); }}
      >
        <input
          ref={inputRef}
          id={id}
          type="file"
          className="cgt-dropzone-input"
          accept=".pdf,.jpg,.jpeg,.png"
          multiple={!!multiple}
          onChange={(e) => { process(e.target.files); e.target.value = ""; }}
        />
        <p className="cgt-dropzone-text">
          파일을 이곳에 끌어다 놓거나 <span className="cgt-dropzone-link">클릭하여 선택</span>하세요
        </p>
        <p className="cgt-dropzone-hint">
          PDF, JPG, PNG · 파일당 최대 8MB{multiple ? " · 여러 파일 선택 가능" : ""}
        </p>
      </div>

      {localMsg && <p className="cgt-field-hint cgt-field-hint--warn">{localMsg}</p>}

      {currentFiles.length > 0 && (
        <ul className="cgt-filelist">
          {currentFiles.map((f, i) => (
            <li key={f.name + "-" + i} className="cgt-filelist-item">
              <span className="cgt-filelist-name">{f.name}</span>
              <span className="cgt-filelist-size">{formatFileSize(f.size)}</span>
              <button type="button" className="cgt-filelist-remove"
                aria-label={f.name + " 삭제"}
                onClick={(e) => { e.stopPropagation(); onRemove(multiple ? i : undefined); }}>
                삭제
              </button>
            </li>
          ))}
        </ul>
      )}

      {error && <p className="cgt-field-error" role="alert">{error}</p>}
    </div>
  );
}

/* =========================================================
   App: 전체 상태 관리
   개인정보는 브라우저 메모리(React state)에만 일시 보관하며
   localStorage 등에 저장하지 않으므로 새로고침 시 모두 초기화됩니다.
   ========================================================= */

function App() {
  const [phase, setPhase] = useState("landing"); // landing | form | complete
  const [formStep, setFormStep] = useState(1);

  const [applicant, setApplicant] = useState({ name: "", phone: "", email: "" });
  const [property, setProperty] = useState({
    propertyType: "", propertyAddress: "", acquisitionDate: "", transferDate: "",
    acquisitionPrice: "", transferPrice: "", reportedTax: "",
  });
  const [documents, setDocuments] = useState({
    taxReturn: null, purchaseContract: null, saleContract: null, other: [],
  });
  const [consent, setConsent] = useState(false);
  const [stepErrors, setStepErrors] = useState({});

  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);
  const [progressMessage, setProgressMessage] = useState("");

  const caseNoRef = useRef(null);
  const uploadedKeysRef = useRef(new Set());

  const goNext = () => {
    let errs = {};
    if (formStep === 1) errs = validateApplicant(applicant);
    if (formStep === 2) errs = validateDocuments(documents);
    if (formStep === 3) errs = validateProperty(property);
    setStepErrors(errs);
    if (Object.keys(errs).length === 0) {
      setFormStep((s) => Math.min(4, s + 1));
      window.scrollTo({ top: 0 });
    }
  };

  const goPrev = () => {
    setStepErrors({});
    setFormStep((s) => Math.max(1, s - 1));
    window.scrollTo({ top: 0 });
  };

  const buildQueue = () => {
    const q = [];
    if (documents.taxReturn) {
      q.push({ key: "taxReturn", type: "taxReturn", msg: "신고서 업로드 중...", file: documents.taxReturn });
    }
    if (documents.purchaseContract) {
      q.push({ key: "purchaseContract", type: "purchaseContract", msg: "취득계약서 업로드 중...", file: documents.purchaseContract });
    }
    if (documents.saleContract) {
      q.push({ key: "saleContract", type: "saleContract", msg: "양도계약서 업로드 중...", file: documents.saleContract });
    }
    documents.other.forEach((f, i) => {
      q.push({
        key: "other-" + i, type: "other",
        msg: "기타자료 업로드 중 (" + (i + 1) + "/" + documents.other.length + ")...",
        file: f,
      });
    });
    return q;
  };

  const handleSubmit = async () => {
    if (!consent || submitting) return;
    setSubmitError(null);
    setSubmitting(true);
    try {
      if (!caseNoRef.current) {
        setProgressMessage("신청정보 저장 중...");
        const data = await postToAppsScript({
          action: "createCase",
          name: applicant.name,
          phone: applicant.phone,
          email: applicant.email,
          propertyType: property.propertyType,
          propertyAddress: property.propertyAddress,
          acquisitionDate: property.acquisitionDate,
          transferDate: property.transferDate,
          acquisitionPrice: moneyToNumber(property.acquisitionPrice),
          transferPrice: moneyToNumber(property.transferPrice),
          reportedTax: moneyToNumber(property.reportedTax),
          privacyConsent: true,
        });
        caseNoRef.current = data.no;
      }

      const queue = buildQueue();
      for (let i = 0; i < queue.length; i++) {
        const item = queue[i];
        if (uploadedKeysRef.current.has(item.key)) continue;
        setProgressMessage(item.msg);
        const base64 = await fileToBase64(item.file);
        await postToAppsScript({
          action: "uploadFile",
          no: caseNoRef.current,
          name: applicant.name,
          documentType: item.type,
          fileName: item.file.name,
          mimeType: item.file.type || "application/octet-stream",
          base64: base64,
        });
        uploadedKeysRef.current.add(item.key);
      }

      setProgressMessage("접수 완료");
      setPhase("complete");
    } catch (err) {
      setSubmitError(err.message || "제출 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.");
    } finally {
      setSubmitting(false);
    }
  };

  let stepBody = null;
  if (formStep === 1) {
    stepBody = <StepApplicant value={applicant} errors={stepErrors} onChange={setApplicant} />;
  } else if (formStep === 2) {
    stepBody = <StepDocuments value={documents} errors={stepErrors} onChange={setDocuments} />;
  } else if (formStep === 3) {
    stepBody = <StepProperty value={property} errors={stepErrors} onChange={setProperty} />;
  } else if (formStep === 4) {
    stepBody = (
      <React.Fragment>
        <StepConsent applicant={applicant} property={property} documents={documents}
          consent={consent} onConsentChange={setConsent} />
        <SubmitStatus submitting={submitting} progressMessage={progressMessage}
          error={submitError} onRetry={handleSubmit} />
      </React.Fragment>
    );
  }

  return (
    <div className="cgt-app">
      <TopBar />
      {phase === "landing" && <LandingView onStart={() => setPhase("form")} />}
      {phase === "form" && (
        <FormShell
          formStep={formStep}
          onPrev={goPrev}
          onNext={goNext}
          onSubmit={handleSubmit}
          submitting={submitting}
          isLastStep={formStep === 4}
          submitDisabled={submitting || !consent}
        >
          {stepBody}
        </FormShell>
      )}
      {phase === "complete" && <CompleteView />}
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
